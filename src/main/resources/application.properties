server.port=9001

server.servlet.context-path=/cart-service

spring.application.name=cart-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://identity:8080/realms/CourseRealm}

# ----- DATABASE - JPA - FLYWAY -----
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${MSSQL_DATASOURCE_URL:jdbc:sqlserver://localhost:14330};databaseName=cart_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${MSSQL_SA_USERNAME:sa}
spring.datasource.password=${MSSQL_SA_PASSWORD:6$3S6zPKpJ+Y2-*J}

# Hibernate ddl auto (none, create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.SQLServer2012Dialect

spring.flyway.enable=true
spring.flyway.baseline-on-migrate=true
spring.flyway.location=classpath:db/migration

# ----- SWAGGER UI -----
springdoc.swagger-ui.path=/swagger-ui
springdoc.packagesToScan=com.hub.cart_service
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.client-id=swagger-ui
springdoc.oauthflow.authorization-url=KC:http://identity/realms/CourseRealm/protocol/openid-connect/auth
springdoc.oauthflow.token-url=${KEYCLOAK_TOKEN_URL:http://identity/realms/CourseRealm/protocol/openid-connect/token}
# KAFKA EVENT CONSUMER CONFIG
# ============================
spring.cloud.stream.bindings.handleCourseStructureUpdatedEvent-in-0.destination=course.events
spring.cloud.stream.bindings.handleCourseStructureUpdatedEvent-in-0.group=cart-service-group

# N?u ch?y local Kafka
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKER:localhost:9092}
spring.cloud.stream.kafka.binder.auto-create-topics=true
spring.cloud.stream.kafka.default.consumer.auto-offset-reset=earliest